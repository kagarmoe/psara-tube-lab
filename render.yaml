services:
  - type: web
    name: psara-tube-lab
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx drizzle-kit push --force && npm run seed:db && node build/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROTOCOL_HEADER
        value: x-forwarded-proto
      - key: HOST_HEADER
        value: x-forwarded-host
      - key: DATABASE_URL
        fromDatabase:
          name: psara-tube-lab-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: MEMBER_ACCESS_CODE
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: psara-tube-lab-db
    plan: free
    databaseName: psara_tube_lab
    user: psara
